<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon tableau</title>
    <meta name="theme-color" content="#e9e5dc" />
    <meta name="description" content="Un tableau Kanban personnel, simple et personnalisable." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <p class="eyebrow">TABLEAU PERSONNEL</p>
          <h1 id="boardTitle">Mon tableau</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="renameBoard" title="Renommer le tableau" aria-label="Renommer le tableau">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L18.2 9.3l-3.5-3.5L4 16.5Zm13.9-12.1 1.7 1.7a1.5 1.5 0 0 1 0 2.1l-1.4 1.4-3.5-3.5 1.4-1.4a1.5 1.5 0 0 1 2.1 0Z"/></svg>
          </button>
          <button class="text-button" id="addColumn">Nouvelle colonne</button>
          <button class="icon-button" id="settingsButton" title="Sauvegarde et réglages" aria-label="Sauvegarde et réglages">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Zm8-3.5 1.3-1-1.8-3.1-1.6.7a7.7 7.7 0 0 0-1.4-.8L16.3 6h-3.6l-.2 1.8a7.7 7.7 0 0 0-1.4.8l-1.6-.7L7.7 11 9 12a6.9 6.9 0 0 0 0 1.9l-1.3 1 1.8 3.1 1.6-.7c.4.3.9.6 1.4.8l.2 1.8h3.6l.2-1.8c.5-.2 1-.5 1.4-.8l1.6.7 1.8-3.1-1.3-1a6.9 6.9 0 0 0 0-1.9Z"/></svg>
          </button>
        </div>
      </header>

      <section class="board" id="board" aria-label="Tableau Kanban"></section>
    </main>

    <template id="columnTemplate">
      <article class="column">
        <div class="column-head">
          <span class="column-swatch"></span>
          <button class="column-name" title="Modifier la colonne"></button>
          <span class="count"></span>
          <button class="more-button" title="Options de la colonne" aria-label="Options de la colonne">•••</button>
        </div>
        <div class="task-list" tabindex="0"></div>
        <button class="add-task">+ Ajouter une tâche</button>
      </article>
    </template>

    <template id="taskTemplate">
      <article class="task" draggable="true">
        <div class="task-grip" aria-hidden="true"></div>
        <p class="task-title"></p>
        <div class="task-bottom"><span class="task-dot"></span><span class="task-label"></span></div>
      </article>
    </template>

    <dialog id="taskDialog" class="dialog">
      <form method="dialog" id="taskForm">
        <div class="dialog-header"><p class="eyebrow" id="taskDialogEyebrow">NOUVELLE TÂCHE</p><button value="cancel" class="close-button" aria-label="Fermer">×</button></div>
        <label>Tâche<input id="taskName" required maxlength="120" placeholder="Ex. Répondre aux messages" /></label>
        <label>Étiquette / détail<input id="taskLabel" maxlength="60" placeholder="Ex. Important" /></label>
        <label>Couleur<input id="taskColor" type="color" value="#E5834D" /></label>
        <div class="dialog-actions"><button type="button" class="danger-button" id="deleteTask">Supprimer</button><span></span><button value="cancel" class="secondary-button">Annuler</button><button class="primary-button" value="default">Enregistrer</button></div>
      </form>
    </dialog>

    <dialog id="columnDialog" class="dialog">
      <form method="dialog" id="columnForm">
        <div class="dialog-header"><p class="eyebrow" id="columnDialogEyebrow">NOUVELLE COLONNE</p><button value="cancel" class="close-button" aria-label="Fermer">×</button></div>
        <label>Nom de la colonne<input id="columnName" required maxlength="40" placeholder="Ex. En cours" /></label>
        <label>Couleur<input id="columnColor" type="color" value="#E5834D" /></label>
        <div class="dialog-actions"><button type="button" class="danger-button" id="deleteColumn">Supprimer</button><span></span><button value="cancel" class="secondary-button">Annuler</button><button class="primary-button" value="default">Enregistrer</button></div>
      </form>
    </dialog>

    <dialog id="settingsDialog" class="dialog">
      <form method="dialog" id="settingsForm">
        <div class="dialog-header"><p class="eyebrow">SAUVEGARDE</p><button value="cancel" class="close-button" aria-label="Fermer">×</button></div>
        <p class="dialog-copy">Tes changements sont sauvegardés automatiquement dans ce navigateur.</p>
        <div class="settings-actions"><button type="button" class="secondary-button" id="exportBoard">Exporter une copie</button><label class="secondary-button import-label">Importer une copie<input id="importBoard" type="file" accept="application/json" /></label></div>
        <p class="dialog-copy small-copy">L’export est utile si tu changes de navigateur ou de Mac.</p>
        <div class="dialog-actions"><button type="button" class="danger-button" id="resetBoard">Réinitialiser le tableau</button><span></span><button class="primary-button" value="default">Fermer</button></div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
